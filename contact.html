<button type="submit" id="submitBtn">送出留言</button>
<p id="result"></p>

</form>
</main>

<footer>
<p>© 2026 小太陽咖啡館</p>
<p>期待您的光臨 ☀️</p>
</footer>

<script>
const gasUrl = "https://script.google.com/macros/s/AKfycbxlkX4LhYPTTgb6Fg2hTsqyoNliXH2H_tZQv26KCw3SeVMjarM8eU4R56sD4oUyYW5z/exec";

const form = document.getElementById("contactForm");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = document.getElementById("submitBtn");
  const result = document.getElementById("result");

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value
  };

  button.disabled = true;
  result.innerText = "正在送出，請稍候……";

  try {
    await fetch(gasUrl, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    result.innerText =
      "已送出請求！請稍後確認信箱是否收到留言。";

    form.reset();

  } catch (error) {
    result.innerText = "送出時發生錯誤，請稍後再試。";
  }

  button.disabled = false;
});
</script>

</body>
</html>
