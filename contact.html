<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聯絡我們｜小太陽咖啡館</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffaf0;
  color: #594331;
}
header {
  background: #f5d99b;
  padding: 22px;
  text-align: center;
}
nav a {
  margin: 12px;
  color: #594331;
  text-decoration: none;
  font-weight: bold;
}
main {
  max-width: 650px;
  margin: auto;
  padding: 35px 20px;
}
form {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 2px 10px #ddd;
}
label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}
input, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #d8c6a5;
  border-radius: 8px;
  font-size: 16px;
}
button {
  margin-top: 20px;
  padding: 12px 25px;
  background: #a66b3f;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
footer {
  background: #594331;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<header>
<h2>☀️ 小太陽咖啡館</h2>
<nav>
<a href="index.html">首頁</a>
<a href="about.html">關於我們</a>
<a href="contact.html">聯絡我們</a>
</nav>
</header>

<main>
<h1>📩 聯絡我們</h1>
<p>有任何問題或建議，歡迎留下訊息！</p>

<form id="contactForm">
<label>姓名</label>
<input type="text" id="name" required>

<label>電話</label>
<input type="tel" id="phone" required>

<label>Email</label>
<input type="email" id="email" required>

<label>留言內容</label>
<textarea id="message" rows="5" required></textarea>

<button type="submit">送出留言</button>
<p id="result"></p>
</form>
</main>

<footer>
<p>© 2026 小太陽咖啡館</p>
<p>期待您的光臨 ☀️</p>
</footer>

</body>
</html>
