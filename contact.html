<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯絡我們｜晨星數位行銷</title><style>
:root{--navy:#13243a;--blue:#1769aa;--sky:#eaf4fc;--ink:#243447;--muted:#617286;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;color:var(--ink);line-height:1.7;background:#f7f9fc}
header{background:var(--navy);color:white}
.nav{max-width:1080px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;color:white;text-decoration:none}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{color:#e9f3ff;text-decoration:none}
nav a:hover{text-decoration:underline}
.hero{background:linear-gradient(135deg,#eaf4fc,#fff);padding:76px 22px}
.wrap{max-width:1080px;margin:auto;padding:42px 22px}
.hero .wrap{padding-top:0;padding-bottom:0}
.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em}
h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.2;margin:.35em 0}
h2{color:var(--navy);line-height:1.3}
.lead{font-size:1.12rem;max-width:700px;color:#43566b}
.btn{display:inline-block;background:var(--blue);color:white;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:1rem}
.btn:hover{background:#10558c}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px}
.card{background:white;border:1px solid #e0e8f0;border-radius:14px;padding:22px;box-shadow:0 6px 20px #17324d0a}
.card h3{margin-top:0;color:var(--navy)}
form{background:white;border:1px solid #e0e8f0;border-radius:14px;padding:26px;max-width:720px;box-shadow:0 6px 20px #17324d0a}
label{display:block;font-weight:700;margin:15px 0 6px}
input,textarea{width:100%;padding:12px 13px;border:1px solid #c7d3df;border-radius:8px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #9bcaf0;border-color:var(--blue)}
textarea{min-height:150px;resize:vertical}
.note{font-size:.93rem;color:var(--muted)}
footer{background:#102035;color:#dce8f5;padding:25px 22px;margin-top:30px}
footer .wrap{padding-top:0;padding-bottom:0}
@media(max-width:600px){.nav{align-items:flex-start;flex-direction:column}.hero{padding:52px 0}form{padding:18px}}
</style></head>
<body><header><div class="nav"><a class="brand" href="index.html">晨星數位行銷</a><nav><a href="index.html">首頁</a><a href="about.html">公司介紹</a><a href="contact.html">聯絡我們</a></nav></div></header>
<main><section class="hero"><div class="wrap"><div class="eyebrow">CONTACT</div><h1>告訴我們你的需求</h1><p class="lead">請填寫以下表單，我們會透過你留下的聯絡方式回覆。</p></div></section>
<section class="wrap"><form action="https://formsubmit.co/sslin0315@gmail.com" method="POST">
<input type="hidden" name="_subject" value="網站聯絡表單新訊息">
<input type="hidden" name="_template" value="table">
<label for="name">姓名 *</label><input id="name" name="姓名" type="text" autocomplete="name" required placeholder="請輸入姓名">
<label for="phone">電話 *</label><input id="phone" name="電話" type="tel" autocomplete="tel" required placeholder="請輸入聯絡電話">
<label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com">
<label for="message">聯絡內容 *</label><textarea id="message" name="聯絡內容" required placeholder="請輸入想詢問的內容"></textarea>
<p class="note">送出後，表單內容會寄送至網站管理者設定的收件信箱。請勿填寫密碼或其他敏感資料。</p>
<button class="btn" type="submit">送出表單</button></form></section></main>
<footer><div class="wrap">© 2026 晨星數位行銷｜用心規劃每一次線上溝通。</div></footer></body></html>
